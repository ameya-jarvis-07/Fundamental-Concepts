<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sorting Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="algorithm">Algorithm:</label>
                <select id="algorithm">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                    <option value="heap">Heap Sort</option>
                </select>
            </div>

            <div class="control-group">
                <label for="language">Language:</label>
                <select id="language">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="go">Go</option>
                </select>
            </div>

            <div class="control-group">
                <label for="arraySize">Array Size: <span id="arraySizeValue">50</span></label>
                <input type="range" id="arraySize" min="10" max="100" value="50">
            </div>

            <div class="control-group">
                <label for="speed">Speed: <span id="speedValue">50</span></label>
                <input type="range" id="speed" min="1" max="100" value="50">
            </div>

            <div class="button-group">
                <button id="startSort" class="btn btn-primary">Start Sorting</button>
                <button id="stopSort" class="btn btn-danger" disabled>Stop</button>
                <button id="scramble" class="btn btn-secondary">🔀 Scramble</button>
                <button id="showCode" class="btn btn-secondary">📝 Show Code</button>
                <button id="toggleSound" class="btn btn-secondary">🔊 Sound On</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Comparisons:</span>
                <span id="comparisons" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Swaps:</span>
                <span id="swaps" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Time Complexity:</span>
                <span id="timeComplexity" class="stat-value">O(n²)</span>
            </div>
        </div>

        <div id="visualizer" class="visualizer"></div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color default"></div>
                <span>Unsorted</span>
            </div>
            <div class="legend-item">
                <div class="legend-color comparing"></div>
                <span>Comparing</span>
            </div>
            <div class="legend-item">
                <div class="legend-color swapping"></div>
                <span>Swapping</span>
            </div>
            <div class="legend-item">
                <div class="legend-color sorted"></div>
                <span>Sorted</span>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Code Modal -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Bubble Sort - JavaScript</h2>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <pre><code id="codeDisplay"></code></pre>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
